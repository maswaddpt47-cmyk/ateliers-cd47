  const VIS_ITEMS = [
    {key:'saisie',     label:String.fromCodePoint(0x270F)+' Saisie',     sub:'Formulaire de saisie'},
    {key:'historique', label:String.fromCodePoint(0x1F4CB)+' Historique', sub:'Liste des ateliers'},
    {key:'graphiques', label:String.fromCodePoint(0x1F4CA)+' Graphiques', sub:'Tableaux de bord'},
    {key:'carte',      label:String.fromCodePoint(0x1F5FA)+' Carte',      sub:'Carte des communes'},
    {key:'bingo',      label:String.fromCodePoint(0x1F3AF)+' Bingo',      sub:'Jeu Bingo'},
  ];

  React.useEffect(()=>{
    apiFetch('getVisibility').then(res=>{ if(res.ok) setVisibility(res.visibility); }).catch(()=>{});
  },[]);

  async function handleSaveVisibility(){
    setVisSaving(true);
    try {
      const res = await apiFetch('saveVisibility', {visibility: JSON.stringify(visibility)});
      if(res.ok){ showToast('Visibilite sauvegardee'); addLog('Visibilite frontend mise a jour','ok'); }
      else throw new Error(res.error);
    } catch(err){ showToast('Erreur : '+err.message, false); }
    finally { setVisSaving(false); }
  }

  function toggleVis(key){ setVisibility(v=>({...v,[key]:!v[key]})); }
  const [importing,setImporting] = React.useState(false);
  const [importProgress,setImportProgress] = React.useState(0);
  const [importMsg,setImportMsg] = React.useState('');

  // ── Réinitialisation ──
  function handleReset() {
    if(resetStep===0){ setResetStep(1); return; }
    if(resetStep===1){ setResetStep(2); return; }
    // Étape 3 : exécution
    addLog('Réinitialisation BDD locale demandée','info');
    showToast('✅ BDD locale vidée (Google Sheet intact)');
    setResetStep(0);
    onRefresh();
  }

  // ── Import CSV ──
  async function handleImportCSV(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value='';
    setImporting(true); setImportProgress(0); setImportMsg('Lecture du fichier…');

    try {
      const text = await file.text();
      const lines = text.split('\n').filter(l=>l.trim());
      if (lines.length < 2) throw new Error('Fichier vide ou invalide');

      // Détecter le séparateur (virgule ou point-virgule)
      const firstLine = lines[0];
      const sep = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';

      function parseCSVLine(line) {
        const res=[]; let cur='', inQ=false;
        for(let i=0;i<line.length;i++){
          const c=line[i];
          if(c==='"') inQ=!inQ;
          else if(c===sep&&!inQ){ res.push(cur.trim()); cur=''; }
          else cur+=c;
        }
        res.push(cur.trim()); return res;
      }

      const headers = parseCSVLine(lines[0]).map(h=>h.replace(/^"|"$/g,'').trim());
      const entries_raw = [];

      for(let i=1;i<lines.length;i++){
        const vals = parseCSVLine(lines[i]);
        if(vals.length < 3) continue;
        const row={};
        headers.forEach((h,idx)=>{ row[h]=vals[idx]?vals[idx].replace(/^"|"$/g,'').trim():''; });
        if(!row._id && !row.statut) continue;

        const entry = {
          _id: row._id || genId(),
          _n: parseInt(row._n)||0,
          statut: row.statut||'Planifié',
          date: normalizeDate(row.date),
          horaire: normalizeHoraire(row.horaire),
          ampm: row.ampm||'AM',
          orienteur: row.orienteur||'',
          commune: normalizeCommune(row.commune),
          lieu: row.lieu||'',
          thematique: row.thematique||'',
          inscrits: row.inscrits===''?'':parseInt(row.inscrits)||0,
          presents: row.presents===''?'':parseInt(row.presents)||0,
          public: row.pub||row.public||'Tous publics',
          conseiller: row.conseiller||'',
          materiel: MATERIELS.filter(m=>row[m]==='OUI'),
          residence: row.residence||'',
          remarques: row.remarques||''
        };
        entries_raw.push(entry);
      }

      setImportMsg(`${entries_raw.length} lignes parsées — envoi vers Google Sheets…`);

      // Envoyer par lots de 20 via GET (contourne CORS depuis file://)
      const BATCH = 5;
      let done = 0;
      for (let i = 0; i < entries_raw.length; i += BATCH) {
        const batch = entries_raw.slice(i, i + BATCH);
        const params = new URLSearchParams({
          action: 'saveMany',
          entries: JSON.stringify(batch)
        });
        const res = await Promise.race([
          fetch(`${GS_URL}?${params.toString()}`),
          new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),45000))
        ]);
        const data = await res.json();
        if(!data.ok) throw new Error(data.error);
        done += batch.length;
        setImportProgress(Math.round(done/entries_raw.length*100));
        setImportMsg(`${done}/${entries_raw.length} lignes importées…`);
      }

      addLog(`Import CSV : ${entries_raw.length} ateliers importés`,'ok');
      showToast(`✅ ${entries_raw.length} ateliers importés`);
      onRefresh();
    } catch(err) {
      addLog('Erreur import : '+err.message,'err');
      showToast('❌ Erreur import : '+err.message, false);
    } finally {
      setImporting(false); setImportProgress(0); setImportMsg('');
    }
  }

  // ── Import XLSX ──
  async function handleImportXLSX(e) {
    const file = e.target.files[0];
    if(!file) return;
    e.target.value='';
    setImporting(true); setImportProgress(0); setImportMsg('Lecture du fichier Excel…');
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws,{defval:''});

      const entries_raw = rows.map(row=>({
        _id: row._id||genId(),
        _n: parseInt(row._n)||0,
        statut: row.statut||'Planifié',
        date: normalizeDate(row.date),
        horaire: normalizeHoraire(row.horaire),
        ampm: row.ampm||'AM',
        orienteur: row.orienteur||'',
        commune: normalizeCommune(row.commune),
        lieu: row.lieu||'',
        thematique: row.thematique||'',
        inscrits: row.inscrits===''?'':parseInt(row.inscrits)||0,
        presents: row.presents===''?'':parseInt(row.presents)||0,
        public: row.pub||row.public||'Tous publics',
        conseiller: row.conseiller||'',
        materiel: MATERIELS.filter(m=>row[m]==='OUI'||(Array.isArray(row.materiel)&&row.materiel.includes(m))),
        residence: row.residence||'',
        remarques: row.remarques||''
      })).filter(e=>e._id&&e.statut);

      const BATCH=50; let done=0;
      for(let i=0;i<entries_raw.length;i+=BATCH){
        const batch=entries_raw.slice(i,i+BATCH);
        const res=await apiFetch('saveMany',{entries:batch});
        if(!res.ok) throw new Error(res.error);
        done+=batch.length;
        setImportProgress(Math.round(done/entries_raw.length*100));
        setImportMsg(`${done}/${entries_raw.length} lignes importées…`);
      }

      addLog(`Import XLSX : ${entries_raw.length} ateliers importés`,'ok');
      showToast(`✅ ${entries_raw.length} ateliers importés`);
      onRefresh();
    } catch(err){
      addLog('Erreur import XLSX : '+err.message,'err');
      showToast('❌ '+err.message,false);
    } finally { setImporting(false); setImportProgress(0); setImportMsg(''); }
  }

  const resetLabels=['🗑️ Réinitialiser la BDD locale','⚠️ Confirmer (1/2)','🚨 Confirmer définitivement (2/2)'];

  return CE('div',null,
    CE('div',{className:'card'},
      CE('h2',null,'⚙️ Panneau Administrateur'),
      CE('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:8}},
        CE('div',{className:'kpi'},CE('div',{className:'val'},entries.length),CE('div',{className:'lbl'},'Total ateliers')),
        CE('div',{className:'kpi'},CE('div',{className:'val'},entries.filter(e=>e.statut==='Réalisé').length),CE('div',{className:'lbl'},'Réalisés'))
      )
    ),

    CE('div',{className:'admin-section'},
      CE('h3',null,'📥 Import CSV (migration depuis fichier existant)'),
      CE('p',{style:{fontSize:12,color:'#4a5568',marginBottom:12}},
        'Importe le fichier Ateliers_TEST.csv ou tout export CSV compatible. Les entrées existantes sont fusionnées (pas écrasées).'),
      importing
        ? CE('div',null,
            CE('p',{style:{fontSize:12,color:'#4a5568',marginBottom:6}},importMsg),
            CE('div',{className:'progress-bar'},CE('div',{className:'progress-fill',style:{width:importProgress+'%'}})),
            CE('p',{style:{fontSize:11,color:'#718096',marginTop:4}},importProgress+'%')
          )
        : CE('label',{style:{display:'inline-block',cursor:'pointer'}},
            CE('span',{className:'btn btn-primary'},'📂 Choisir un fichier CSV'),
            CE('input',{type:'file',accept:'.csv',style:{display:'none'},onChange:handleImportCSV})
          )
    ),

    CE('div',{className:'admin-section'},
      CE('h3',null,'📊 Import XLSX (fichier exporté depuis cette app)'),
      CE('p',{style:{fontSize:12,color:'#4a5568',marginBottom:12}},
        'Réimporte un fichier .xlsx précédemment exporté depuis l\'historique.'),
      importing
        ? CE('div',null,CE('p',{style:{fontSize:12,color:'#4a5568'}},importMsg))
        : CE('label',{style:{display:'inline-block',cursor:'pointer'}},
            CE('span',{className:'btn btn-warn'},'📂 Choisir un fichier XLSX'),
            CE('input',{type:'file',accept:'.xlsx',style:{display:'none'},onChange:handleImportXLSX})
          )
    ),

    CE('div',{className:'admin-section'},
      CE('h3',null,'Visibilite du Frontend'),
      CE('p',{style:{fontSize:12,color:'#4a5568',marginBottom:14}},
        'Activez ou desactivez les rubriques du frontend. Sauvegardez pour appliquer.'),
      visibility===null
        ? CE('div',{style:{color:'#718096',fontSize:13}},'Chargement...')
        : CE('div',null,
            VIS_ITEMS.map(item=>
              CE('div',{key:item.key,className:'toggle-row'},
                CE('div',null,
                  CE('div',{className:'toggle-label'},item.label),
                  CE('div',{className:'toggle-sub'},item.sub)
                ),
                CE('label',{className:'tgl'},
                  CE('input',{type:'checkbox',checked:!!visibility[item.key],onChange:()=>toggleVis(item.key)}),
                  CE('div',{className:'tgl-track'})
                )
              )
            ),
            CE('button',{
              className:'btn btn-primary',
              style:{marginTop:16},
              onClick:handleSaveVisibility,
              disabled:visSaving
            }, visSaving ? 'Sauvegarde...' : 'Sauvegarder la visibilite')
          )
    ),

    CE('div',{className:'admin-section'},
      CE('h3',null,'🗑️ Réinitialiser la base de données'),
      CE('p',{style:{fontSize:12,color:'#4a5568',marginBottom:12}},
        'Vide uniquement le cache local. Le Google Sheet reste intact. Utile pour forcer un rechargement complet.'),
      resetStep>0&&CE('div',{className:'confirm-box'},
        CE('p',null,resetStep===1?'Êtes-vous sûr ? Cette action vide le cache local.':'Dernière confirmation — cliquez pour confirmer.')),
      CE('div',{style:{display:'flex',gap:10}},
        CE('button',{className:'btn btn-danger',onClick:handleReset},resetLabels[resetStep]),
        resetStep>0&&CE('button',{className:'btn btn-secondary',onClick:()=>setResetStep(0)},'Annuler')
      )
    )
  );
}

// ═══════════════════════════════════════════════════════════
// APP PRINCIPALE
// ═══════════════════════════════════════════════════════════
function App() {
  const [auth,setAuth] = React.useState(false);
  const [view,setView] = React.useState('historique');
  const [editingId,setEditingId] = React.useState(null);
  const [entries,setEntries] = React.useState([]);
  const [loading,setLoading] = React.useState(true);
  const [error,setError] = React.useState(null);
  const [logs,setLogs] = React.useState([]);
  const [newEntries,setNewEntries] = React.useState([]);
  const [seenIds,setSeenIds] = React.useState(new Set());
  const [showListes, setShowListes] = React.useState(false);
  const [lists, setLists] = React.useState({
    statuts:    [...STATUTS_DEFAULT],
    conseillers:[...CONSEILLERS_DEFAULT],
    publics:    [...PUBLICS_DEFAULT],
    materiels:  [...MATERIELS_DEFAULT],
  });

  function addLog(msg,type='info'){
    const t=new Date().toLocaleTimeString('fr-FR');
    setLogs(l=>[{msg,type,t},...l].slice(0,50));
  }

  async function loadData(attempt=1){
    setLoading(true); setError(null);
    try {
      const res=await Promise.race([
        fetch(`${GS_URL}?action=getAll`),
        new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),25000))
      ]);
      const data=await res.json();
      if(!data.ok) throw new Error(data.error||'Erreur serveur');
      const incoming = data.entries||[];
      setEntries(incoming);
      // ── Hydrater les listes depuis GAS (v8.2) ──────────────
      if (data.lists) {
        const l = data.lists;
        setLists({
          statuts:    Array.isArray(l.statuts)     ? l.statuts     : [...STATUTS_DEFAULT],
          conseillers:Array.isArray(l.conseillers) ? l.conseillers : [...CONSEILLERS_DEFAULT],
          publics:    Array.isArray(l.publics)     ? l.publics     : [...PUBLICS_DEFAULT],
          materiels:  Array.isArray(l.materiels)   ? l.materiels   : [...MATERIELS_DEFAULT],
        });
        // Mettre à jour les globals rétrocompat utilisés dans STATUTS/CONSEILLERS
        STATUTS     = Array.isArray(l.statuts)     ? [...l.statuts]     : [...STATUTS_DEFAULT];
        CONSEILLERS = Array.isArray(l.conseillers) ? [...l.conseillers] : [...CONSEILLERS_DEFAULT];
        PUBLICS     = Array.isArray(l.publics)     ? [...l.publics]     : [...PUBLICS_DEFAULT];
        MATERIELS   = Array.isArray(l.materiels)   ? [...l.materiels]   : [...MATERIELS_DEFAULT];
        addLog('Listes synchronisées depuis Google Sheets','ok');
      }
      addLog(`${incoming.length} ateliers chargés`,'ok');
      // Détecter les nouveaux enregistrements
      setSeenIds(prev => {
        if(prev.size === 0) {
          // Premier chargement — tout marquer comme vu
          return new Set(incoming.map(e=>e._id));
        }
        const nouvs = incoming.filter(e=>!prev.has(e._id));
        if(nouvs.length > 0) setNewEntries(n=>[...nouvs,...n]);
        return new Set(incoming.map(e=>e._id));
      });
      setLoading(false);
    } catch(err){
      if(err.message==='timeout'&&attempt<3){
        addLog(`Tentative ${attempt}/3, nouvel essai…`,'info');
        setTimeout(()=>loadData(attempt+1),2000);
      } else {
        setError(attempt>1?'Google Sheets ne répond pas après 3 tentatives.':'Impossible de charger : '+err.message);
        addLog('Erreur chargement : '+err.message,'err');
        setLoading(false);
      }
    }
  }

  React.useEffect(()=>{ loadData(); loadCommunes47().catch(()=>{}); },[]);

  async function handleDelete(id){
    try {
      const res=await apiFetch('delete',{_id:id});
      if(!res.ok) throw new Error(res.error);
      showToast('✅ Atelier supprimé');
      addLog('Suppression atelier '+id,'ok');
      loadData();
    } catch(err){ showToast('❌ '+err.message,false); }
  }

  function handleEdit(id){ setEditingId(id); setView('saisie'); }

  if(!auth) return CE(Login,{onLogin:()=>setAuth(true)});

  const nav=(v,label)=>CE('button',{className:view===v?'active':'',onClick:()=>setView(v)},label);

  return CE('div',null,
    CE('nav',null,
      CE('span',{className:'logo'},'🖥️ Ateliers de l\'Inclusion Numérique du CD47',CE('span',{style:{background:'rgba(255,255,255,.18)',borderRadius:10,padding:'1px 7px',fontSize:12,fontWeight:700,marginLeft:8,verticalAlign:'middle'}},entries.length)),
      CE('span',{className:'admin-badge'},'ADMIN'),
      nav('saisie','✏️ Saisie'),
      nav('historique','📋 Historique'),
      nav('graphiques','📊 Graphiques'),
      nav('carte','🗺️ Carte'),
      nav('domino','🎯 Bingo'),
      nav('admin','⚙️ Admin'),
      nav('logs','📋 Logs'),
      CE('button',{
        className: view==='listes'?'active':'',
        style:{background:'rgba(255,255,255,.12)',borderColor:'rgba(255,255,255,.3)',border:'1px solid',marginLeft:8},
        onClick:()=>setShowListes(true)
      },'📋 Listes'),
      newEntries.length>0&&CE('button',{
        className:'notif',
        onClick:()=>{ setView('historique'); window._filterNewEntries&&window._filterNewEntries(newEntries.map(e=>e._id)); setNewEntries([]); }
      },'🔔 Nouveaux ',CE('span',{className:'notif-badge'},newEntries.length))
    ),
    CE('div',{className:'main'},
      loading&&CE('div',{className:'loading-full'},
        CE('div',{className:'big-spin'}),CE('span',null,'Chargement…')),
      error&&CE('div',{className:'error-box'},
        CE('strong',null,'❌ Impossible de charger les données'),
        CE('span',null,error),
        CE('button',{className:'btn btn-primary',onClick:loadData},'🔄 Réessayer')),
      !loading&&!error&&CE('div',null,
        view==='saisie'     &&CE(VueSaisie,    {entries,onSaved:loadData,onNewEntry:e=>{setNewEntries(n=>[e,...n]);setSeenIds(s=>{const ns=new Set(s);ns.add(e._id);return ns;});},lists,editingId,onClearEdit:()=>setEditingId(null)}),
        view==='historique' &&CE(VueHistorique,{entries,onEdit:handleEdit,onDelete:handleDelete,onRefresh:loadData}),
        view==='graphiques' &&CE(VueGraphiques,{entries}),
        view==='carte'      &&CE(VueCarte,     {entries,active:view==='carte'}),
        view==='domino'     &&CE(VueBingo,    {entries}),
        view==='admin'      &&CE(VueAdmin,     {entries,onRefresh:loadData,addLog}),
        view==='logs'       &&CE('div',{className:'card'},
          CE('h2',null,'📋 Journal des opérations'),
          logs.length===0
            ?CE('p',{style:{color:'#718096',fontSize:13}},'Aucune opération enregistrée.')
            :logs.map((l,i)=>CE('div',{key:i,className:`log-entry log-${l.type}`},
              CE('span',{className:'log-time'},l.t),
              CE('span',null,l.msg)
            ))
        )
      )
    ),
    showListes&&CE(VueListes,{
      lists,
      onSave:newLists=>{
        setLists(newLists);
        // Mettre à jour les globals rétrocompat
        STATUTS     = Array.isArray(newLists.statuts)     ? [...newLists.statuts]     : STATUTS;
        CONSEILLERS = Array.isArray(newLists.conseillers) ? [...newLists.conseillers] : CONSEILLERS;
        PUBLICS     = Array.isArray(newLists.publics)     ? [...newLists.publics]     : PUBLICS;
        MATERIELS   = Array.isArray(newLists.materiels)   ? [...newLists.materiels]   : MATERIELS;
      },
      onClose:()=>setShowListes(false)
    }),
    CE('div',{id:'toast',className:'toast',style:{opacity:0}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(CE(App));
</script>
</body>
</html>
